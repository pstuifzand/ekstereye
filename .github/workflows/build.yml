# Lint, test, build the reader and publish the static bundle as a release asset.
#
# There is no image and no registry: the host serves the extracted dist/ from
# Caddy, so what ships is the same Vite output the old nginx container held.
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Lint, test and build
        run: |
          set -eu
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/src -w /src node:22-alpine \
            sh -c 'npm ci --no-audit --no-fund && npm run lint && npm test && npm run build && tar czf dist.tar.gz dist'
          ls -l dist.tar.gz

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SHORT=$(echo "$VERSION" | cut -c1-7)
          TAG="build-$SHORT"
          sha256sum dist.tar.gz > SHA256SUMS

          # The tag is the build id, so re-running the same commit replaces the
          # asset instead of failing on a duplicate tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist.tar.gz SHA256SUMS \
            --title "build $SHORT" \
            --notes "Static reader bundle for $SHORT." \
            --target "$VERSION"

          gh release view "$TAG" --json assets -q '.assets[].name'
