# Sent by every response. Kept in a snippet because `add_header` in a location
# block replaces the inherited set rather than adding to it, so all three
# locations have to name these explicitly.
#
# The reader holds the IndieAuth token in localStorage and renders sanitized feed
# HTML in the same origin, so these are the second line of defence behind
# src/sanitize.js, not decoration.
#
# connect-src and img-src allow https: because the Microsub endpoint and the feed
# images come from wherever the reader's own site points them, not from this host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
