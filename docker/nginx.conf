server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The build is ~700 kB of text (482 kB JS, 217 kB CSS) and Vite reports gzip
    # sizes of 177 kB and 30 kB. Without this every cold load transfers the raw
    # files.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    # Requests arrive from the nginx-proxy container, so they are "proxied".
    # The default (off) silently declines to compress them.
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # The router runs in history mode: /callback and /channel/<uid> are routes,
    # not files, so an unknown path is the app, not a 404.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints the file names, so these never change under the same name.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
