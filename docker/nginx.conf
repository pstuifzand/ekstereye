server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The router runs in history mode: /callback and /channel/<uid> are routes,
    # not files, so an unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints the file names, so these never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
